name: Android CI and Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COLMEY_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Compile, lint and unit tests
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
      - name: Verify APK archive
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colmey-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  instrumented:
    name: Android emulator acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COLMEY_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run app UI and bundled model inference tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    name: Publish verified preview APK
    needs: [verify, instrumented]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: colmey-ai-debug-apk
          path: release
      - name: Check release asset
        run: test -s release/app-debug.apk
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE: ${{ secrets.COLMEY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.COLMEY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.COLMEY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.COLMEY_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::warning::No persistent signing key configured. Debug APK remains available as a CI artifact; skipping release. See docs/ANDROID_SIGNING.md"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.available == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        if: steps.signing.outputs.available == 'true'
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.available == 'true'
        with:
          gradle-version: '8.10.2'
      - name: Build stable signed APK
        if: steps.signing.outputs.available == 'true'
        env:
          COLMEY_BUILD_NUMBER: ${{ github.run_number }}
          COLMEY_KEYSTORE_PASSWORD: ${{ secrets.COLMEY_KEYSTORE_PASSWORD }}
          COLMEY_KEY_ALIAS: ${{ secrets.COLMEY_KEY_ALIAS }}
          COLMEY_KEY_PASSWORD: ${{ secrets.COLMEY_KEY_PASSWORD }}
          KEYSTORE_B64: ${{ secrets.COLMEY_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/colmey-release.jks"
          chmod 600 "$RUNNER_TEMP/colmey-release.jks"
          export COLMEY_KEYSTORE_PATH="$RUNNER_TEMP/colmey-release.jks"
          gradle --no-daemon --stacktrace :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk release/colmey-ai.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose release/colmey-ai.apk
          rm -f "$RUNNER_TEMP/colmey-release.jks"
      - name: Publish versioned prerelease
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" release/colmey-ai.apk --target "${GITHUB_SHA}" --title "Colmey AI $TAG (Android preview)" --notes "Persistently signed Android preview. The app checks for newer GitHub releases on launch and asks before opening the download. Older debug-signed installations require a one-time reinstall." --prerelease
