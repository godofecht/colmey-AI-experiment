name: Android APK and Release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and test
        run: gradle --stacktrace --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Verify installable APK exists
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: colmey-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Create or update v0.1.0 prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create v0.1.0 app/build/outputs/apk/debug/app-debug.apk --target "${GITHUB_SHA}" --title "Colmey AI v0.1.0 (Android preview)" --notes "Offline instrument explorer prototype. Debug-signed preview APK, not a production-signed release. Generic image labeling has limited instrument coverage." --prerelease
          fi
